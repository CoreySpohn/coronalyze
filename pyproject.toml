[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "coronalyze"
description = "A JAX-based library for post-processing coronagraphic direct imaging data."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["equinox", "hwoutils", "jax", "jaxlib", "pooch"]
[project.optional-dependencies]
coronagraphoto = ["coronagraphoto>=4.2.0"]
dev = ["pre-commit"]
docs = [
  "sphinx",
  "myst-nb",
  "sphinx-book-theme",
  "sphinx-autoapi",
  "sphinx_autodoc_typehints",
  "ipython",
  "matplotlib",
  "coronagraphoto>=4.2.0",
  "yippy",
  "optixstuff>=3.0.0",
  "numpy",
]
test = [
  "pytest",
  "hypothesis",
  "pytest-cov",
  "pytest-xdist",
  "pytest-testmon",
  "pytest-markdown-docs",
  "pytest-timeout",
  "pytest-fail-slow",
  "numpy",
  "packaging",
  "yippy>=2.0",
]
yippy = ["yippy>=2.0"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/coronalyze"
Issues = "https://github.com/CoreySpohn/coronalyze/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/coronalyze/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
# Only include the src/coronalyze package in the wheel
packages = ["src/coronalyze"]

[tool.hatch.build.targets.sdist]
# Exclude large data files and development artifacts from sdist
exclude = ["/data", "/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "coronalyze"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["coronalyze"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend dynamically.
DEP002 = [
  "jaxlib",
  # The convenience extra installs the producer for the array-based adapter.
  "coronagraphoto",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/coronalyze"]

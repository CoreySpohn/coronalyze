[build-system]
requires = ["hatchling>=1.26.3", "hatch-fancy-pypi-readme>=24.1", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "coronalyze"
description = "A JAX-based library for post-processing coronagraphic direct imaging data."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "equinox>=0.13.2",
  "hwoutils>=1.10.0",
  "jax>=0.8.1",
  "jaxlib>=0.8.1",
  "numpy>=2.0",
  "pooch>=1.8.0",
]
[project.optional-dependencies]
coronagraphoto = ["coronagraphoto>=4.2.0"]
dev = ["pre-commit>=3.7.0"]
docs = [
  "sphinx>=7.2.6",
  "myst-nb>=1.0.0",
  "sphinx-book-theme>=1.1.0",
  "sphinx-autoapi>=3.0.0",
  "sphinx_autodoc_typehints>=2.0.0",
  "ipython>=8.18.1",
  "matplotlib>=3.9",
  "coronagraphoto>=4.2.0",
  "yippy>=2.0",
  "optixstuff>=3.0.0",
  "numpy>=2.0",
]
test = [
  "pytest>=7.3.2",
  "hypothesis>=6.79.1",
  "ineedvalidation>=1.0.0",
  "psutil>=5.9.4",
  "pytest-xdist>=2.5",
  "pytest-testmon>=2.0.7",
  "pytest-markdown-docs>=0.1.0",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
  "numpy>=2.0",
  "packaging>=23.2",
  "yippy>=2.0",
]
yippy = ["yippy>=2.0"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/coronalyze"
Issues = "https://github.com/CoreySpohn/coronalyze/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/coronalyze/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
# Only include the src/coronalyze package in the wheel
packages = ["src/coronalyze"]

[tool.hatch.build.targets.sdist]
# Exclude large data files and development artifacts from sdist
exclude = ["/data", "/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.ineedvalidation]
library = "coronalyze"

[tool.testbudget]
library = "coronalyze"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["coronalyze"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend dynamically.
DEP002 = [
  "jaxlib",
  # The convenience extra installs the producer for the array-based adapter.
  "coronagraphoto",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/coronalyze"]
